<script>
/* ================= ADD BLOG POSTS HERE =================
   Newest post goes at the TOP of the list.
   Each post: date, title, summary (one line shown in the list),
   and body (an array of paragraphs, each in quotes).
   Write plain text. Push to publish.

   Template to copy:
   {
     date: "Month 2026",
     title: "Post title",
     summary: "One line shown under the title.",
     body: [
       "First paragraph.",
       "Second paragraph.",
     ],
   },
*/

const POSTS = [
  {
    date: "July 2026",
    title: "Welcome to the new kevinawelsh.com",
    summary: "The site got a full rebuild. Here's what changed and what's under the hood.",
    body: [
      "This site started as a single page hosting my resume for the Cloud Resume Challenge. It has grown into a full portfolio: projects, a roadmap recruiters can actually follow, this blog, and an AI assistant in the corner that runs on the same AWS and Bedrock stack I build with.",
      "Under the hood, nothing exotic. Static files on S3 behind CloudFront, deployed by GitHub Actions with the cache invalidated on every push. The AI assistant is a small Lambda with preset questions, response caching, and hard cost caps. Simple, cheap, and every piece of it is mine to maintain.",
    ],
  },
];
/* ================= END EDITABLE SECTION ================= */

document.getElementById("posts").innerHTML = POSTS.length ? POSTS.map(p => `
  <details class="post">
    <summary>
      <div><div class="pt">${p.title}</div><div class="ps">${p.summary}</div></div>
      <span class="pd">${p.date}</span>
    </summary>
    <div class="pbody">${p.body.map(t => `<p>${t}</p>`).join("")}</div>
  </details>`).join("")
  : '<div class="card" style="color:var(--muted)">First post coming soon.</div>';
</script>
