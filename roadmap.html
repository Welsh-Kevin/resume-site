<script>
/* ================= EDIT YOUR ROADMAP HERE =================
   Each item: when, title, note, and a type that sets the dot color:
     "current"  = solid blue dot (what you're doing now)
     "step"     = blue ring (upcoming step)
     "event"    = purple ring (events like re:Invent)
     "goal"     = green ring (big milestones)
   Add, remove, or reorder items freely, update LAST_UPDATED, push. */

const LAST_UPDATED = "July 2026";

const ROADMAP = [
  { when: "Now → Sept 2026", title: "AWS Solutions Architect Associate prep", note: "AWS SimuLearn labs plus KodeKloud labs on the side. Exam in September 2026.", type: "current" },
  { when: "Sept – Nov 2026", title: "AWS CloudOps and AWS Security courses", note: "Franklin University coursework running alongside cert prep.", type: "step" },
  { when: "Nov 2026", title: "AWS CloudOps certification", note: "Picking up Terraform knowledge along the way.", type: "step" },
  { when: "Nov – Dec 2026", title: "AWS re:Invent, Las Vegas", note: "Say hi if you're there.", type: "event" },
  { when: "Dec 2026 / Jan 2027", title: "Begin LFCS", note: "Going deeper on Linux fundamentals.", type: "step" },
  { when: "Summer 2027", title: "B.S. Cloud Computing, graduation", note: "Franklin University.", type: "goal" },
];
/* ================= END EDITABLE SECTION ================= */

document.getElementById("stamp").textContent = "Last updated: " + LAST_UPDATED;
document.getElementById("timeline").innerHTML = ROADMAP.map(r => `
  <div class="tl-item ${r.type === "current" ? "current" : r.type}">
    <div class="tl-when">${r.when}</div>
    <div class="tl-title">${r.title}</div>
    <div class="tl-note">${r.note}</div>
  </div>`).join("");
</script>
